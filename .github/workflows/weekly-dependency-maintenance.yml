name: Weekly compatible dependency repair
on:
  schedule:
    - cron: '37 19 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintain:
    permissions:
      contents: write
      pull-requests: write
    uses: jsw-teams/edgeaegis/.github/workflows/dependency-maintenance.yml@main
    with:
      directory: .
      audit-level: high
      verify: |
        npx playwright install --with-deps chromium
        npm test
